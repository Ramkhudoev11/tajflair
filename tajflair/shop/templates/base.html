<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TajFlair — Интернет-магазин{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Навбар / Шапка -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold fs-3" href="{% url 'home' %}">TajFlair</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="{% url 'home' %}">Главная</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="btn btn-outline-warning btn-sm" href="{% url 'cart_detail' %}">
                            🛒 Корзина
                        </a>
                    </li>

                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="btn btn-warning btn-sm fw-bold" href="{% url 'profile' %}">
                                👤 {{ user.username }}
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-danger btn-sm" href="{% url 'logout' %}">Выйти</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Войти</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-warning btn-sm fw-bold" href="{% url 'register' %}">Регистрация</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал / Футер -->
    <footer class="bg-black text-secondary py-4 mt-5 border-top border-secondary">
        <div class="container text-center">
            <p class="mb-0">© 2026 TajFlair. Все права защищены.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
