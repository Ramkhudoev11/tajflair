<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TajFlair</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10 text-light min-vh-100 d-flex flex-column" style="background-color: #121212 !important;">

    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning fs-3" href="{% url 'home' %}">TajFlair</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Форма поиска -->
                <form class="d-flex my-2 my-lg-0 mx-auto" action="{% url 'home' %}" method="get" style="max-width: 400px; width: 100%;">
                    <div class="input-group">
                        <input class="form-control bg-dark text-light border-secondary"
                               type="search"
                               name="q"
                               placeholder="Поиск товаров..."
                               value="{{ query|default:'' }}"
                               aria-label="Search">
                        <button class="btn btn-warning" type="submit">
                            🔍
                        </button>
                    </div>
                </form>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
    {% if user.is_authenticated %}
        <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'profile' %}">👤 {{ user.username }}</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-sm btn-outline-danger" href="{% url 'logout' %}">Выйти</a>
        </li>
    {% else %}
        <li class="nav-item">
            <a class="btn btn-sm btn-outline-warning" href="{% url 'login' %}">Войти</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-sm btn-warning fw-bold" href="{% url 'register' %}">Регистрация</a>
        </li>
    {% endif %}

    <li class="nav-item ms-2">
        <a class="btn btn-outline-warning fw-bold position-relative" href="{% url 'cart_detail' %}">
            🛒 Корзина
        </a>
    </li>
            </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-dark text-secondary text-center py-3 border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 TajFlair. Все права защищены.</p>
        </div>
    </footer>

    <script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
