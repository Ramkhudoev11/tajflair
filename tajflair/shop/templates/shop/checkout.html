{% extends "shop/base.html" %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h2>Оформление заказа</h2>

    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="full_name" class="form-label">Ваше ФИО / Имя</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Номер телефона</label>
            <input type="text" class="form-control" id="phone" name="phone" placeholder="+992900000000" value="{{ phone|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Адрес доставки</label>
            <textarea class="form-control" id="address" name="address" rows="3" required>{{ address|default:'' }}</textarea>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <a href="{% url 'cart_detail' %}" class="btn btn-secondary">Назад в корзину</a>
            <button type="submit" class="btn btn-success btn-lg">Подтвердить заказ ({{ cart.get_total_price }} TJS)</button>
        </div>
    </form>
</div>
{% endblock %}
