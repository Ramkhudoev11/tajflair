{% extends 'shop/base.html' %}

{% block content %}
<div class="container py-4 text-light">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-light border-secondary shadow">
                <div class="card-header bg-dark border-secondary">
                    <h4 class="mb-0 text-warning">Оформление заказа</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'checkout' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Ваше ФИО</label>
                            <input type="text" name="full_name" class="form-control bg-secondary text-light border-0" required placeholder="Например: Алиев Али">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Номер телефона</label>
                            <input type="text" name="phone" class="form-control bg-secondary text-light border-0" required placeholder="+992 900 00 00 00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Адрес доставки</label>
                            <textarea name="address" class="form-control bg-secondary text-light border-0" rows="3" required placeholder="Город, улица, дом, квартира"></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 btn-lg fw-bold mt-2">Подтвердить заказ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
