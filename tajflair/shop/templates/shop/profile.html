{% extends 'shop/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card bg-dark text-light border-secondary p-4 max-w-600 mx-auto" style="max-width: 600px;">
        <h3 class="text-warning mb-3">Личный кабинет</h3>
        <hr class="border-secondary">
        <p><strong>Логин:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email|default:"Не указан" }}</p>
        <p><strong>Имя:</strong> {{ user.first_name }} {{ user.last_name }}</p>
        <div class="mt-4">
            <a href="{% url 'logout' %}" class="btn btn-outline-danger">Выйти из аккаунта</a>
        </div>
    </div>
</div>
{% endblock %}
